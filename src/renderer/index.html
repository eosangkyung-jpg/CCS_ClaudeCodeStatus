<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Claude Status Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget-container">
    <div class="sr-only" id="srAnnounce" role="status" aria-live="polite"></div>
    <!-- 호버 시 나타나는 말풍선 카드 -->
    <div class="speech-bubble" id="speechBubble">
      <div class="bubble-header">
        <div class="status-indicator-group">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-badge" id="statusBadge" role="status" aria-live="polite">로딩 중...</span>
        </div>
        <div class="bubble-actions">
          <button class="action-btn" id="refreshBtn" title="새로고침" aria-label="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 21h5v-5"/>
            </svg>
          </button>
          <button class="action-btn" id="settingsBtn" title="알림 설정" aria-label="알림 설정" aria-expanded="false" aria-controls="settingsPanel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 상위 프로바이더 선택 탭 바 ([Claude 플랜] vs [Gemini 크레딧]) -->
      <div class="provider-tab-bar" role="tablist" aria-label="사용량 종류">
        <button class="provider-tab-btn active" id="tabClaude" role="tab" aria-selected="true" aria-controls="claudeSection">Claude</button>
        <button class="provider-tab-btn" id="tabGemini" role="tab" aria-selected="false" aria-controls="geminiSection" tabindex="-1">Gemini</button>
      </div>

      <!-- 알림 설정 패널 (구간별 상세 매트릭스 설정) -->
      <div class="settings-panel" id="settingsPanel" style="display: none;">
        <div class="settings-header-row">
          <div class="settings-title">위젯 알림 설정</div>
          <button class="settings-close-btn" id="settingsDoneBtn">✕</button>
        </div>

        <!-- 일반 설정 -->
        <div class="master-toggles">
          <label class="setting-item">
            <input type="checkbox" id="settingOpenAtLogin">
            <span>💻 부팅 시 자동 시작</span>
          </label>
        </div>

        <!-- 구간별 개별 설정 테이블 -->
        <div class="matrix-table">
          <div class="matrix-caption">
            <span>구간별 알림</span>
            <button class="preset-btn" id="presetDanger">80% 이상만</button>
          </div>
          <div class="matrix-header">
            <span>구간 (사용량)</span>
            <label class="col-toggle"><input type="checkbox" id="colBubble" aria-label="모든 구간 말풍선 알림"><span>💬 말풍선</span></label>
            <label class="col-toggle"><input type="checkbox" id="colToast" aria-label="모든 구간 시스템 알림"><span>🔔 시스템</span></label>
          </div>
          <div class="matrix-body" id="matrixRows">
            <!-- JS 동적 생성 또는 정적 렌더링 -->
          </div>
        </div>
      </div>

      <div class="bubble-body" id="normalBubbleBody">
        <!-- 1. Claude 플랜 토큰 사용량 섹션 -->
        <div class="provider-section" id="claudeSection">
          <div class="gauge-section main-metric">
            <div class="usage-row">
              <div class="usage-label" id="sessionLabel">5시간 세션 소진율</div>
              <div class="usage-val" id="sessionVal">--%</div>
            </div>
            <div role="progressbar" aria-label="5시간 세션 소진율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="progress-bar-bg">
              <div class="progress-bar-fill" id="sessionBar" style="width: 0%;"></div>
            </div>
            <div class="metric-meta-row">
              <span id="paceBadge">적정 페이스 유지</span>
              <span class="reset-time" id="resetTime">리셋 확인 중...</span>
            </div>
          </div>

          <div class="sub-inset-card">
            <div class="usage-row sub-row">
              <div class="usage-label">7일 주간 누적 한도</div>
              <div class="usage-val sub-val" id="weeklyVal">--%</div>
            </div>
            <div role="progressbar" aria-label="7일 주간 누적 한도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="progress-bar-bg sub-bar-bg">
              <div class="progress-bar-fill" id="weeklyBar" style="width: 0%;"></div>
            </div>
            <div class="metric-meta-row sub-meta">
              <span id="weeklyStatus">주간 한도 확인 중</span>
              <span id="weeklyResetTime">주간 리셋 정보 확인 중...</span>
            </div>
          </div>
        </div>

        <!-- 2. Google Cloud Gemini 크레딧 섹션 -->
        <div class="provider-section" id="geminiSection" style="display: none;">
          <div class="gauge-section main-metric">
            <div class="usage-row">
              <div class="usage-label">체험 크레딧 소진율</div>
              <div class="usage-val" id="geminiPercentVal">0%</div>
            </div>
            <div role="progressbar" aria-label="체험 크레딧 소진율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="progress-bar-bg">
              <div class="progress-bar-fill" id="geminiBar" style="width: 0%;"></div>
            </div>
            <div class="metric-meta-row">
              <span id="geminiPaceBadge">여유로운 소진</span>
              <span id="geminiSpendDetail">₩ 0 소진</span>
            </div>
          </div>

          <div class="sub-inset-card">
            <div class="usage-row sub-row">
              <div class="usage-label">남은 무료 크레딧</div>
              <div class="usage-val sub-val" id="geminiRemainingVal">₩ 402,977</div>
            </div>
            <div class="metric-meta-row sub-meta">
              <span>프로젝트: gmp-demo-project</span>
              <span>전체: ₩ 402,977</span>
            </div>
          </div>
        </div>

        <div class="quote-text" id="quoteText">데이터를 불러오는 중입니다...</div>
      </div>

      <!-- 친절한 에러/로그인 가이드 카드 -->
      <div class="error-card" id="errorCard" style="display: none;">
        <div class="error-title" id="errorTitle">⚠️ Google Cloud 인증 필요</div>
        <div class="error-desc" id="errorDesc">터미널에서 `gcloud auth login`을 실행해주세요.</div>
        <div class="error-actions">
          <button class="error-retry-btn" id="errorRetryBtn">🔄 다시 확인하기</button>
        </div>
      </div>

      <!-- 테스트용 시뮬레이션 버튼들 (프로덕션 기본 숨김) -->
      <div class="simulation-bar" id="simBar" style="display: none;">
        <span class="sim-label">테스트:</span>
        <button class="sim-btn" data-percent="15">15%</button>
        <button class="sim-btn" data-percent="45">45%</button>
        <button class="sim-btn" data-percent="70">70%</button>
        <button class="sim-btn" data-percent="85">85%</button>
        <button class="sim-btn" data-percent="92">92%</button>
        <button class="sim-btn" data-percent="97">97%</button>
        <button class="sim-btn" data-percent="100">100%</button>
      </div>
    </div>

    <!-- 캐릭터 영역 (드래그 가능) -->
    <div class="character-wrapper" id="characterWrapper">
      <!-- 고양이 사진 다시 섞기(셔플) 버튼 -->
      <button class="shuffle-btn" id="shuffleBtn" title="고양이 사진 다시 섞기" aria-label="고양이 사진 다시 섞기"><span aria-hidden="true">🎲</span></button>

      <!-- 트레이 숨기기 (-) 버튼 -->
      <button class="minimize-btn" id="minimizeBtn" title="트레이로 숨기기" aria-label="트레이로 숨기기"><span aria-hidden="true">−</span></button>

      <!-- 캐릭터 본체 -->
      <div class="character-card" id="characterCard">
        <img id="characterImg" src="../assets/images/cat1.jpg" alt="">

        <!-- 100% 소진 시 사진 위에 뜨는 디지털 리셋 카운트다운 (Claude 전용) -->
        <div class="countdown-badge" id="countdownBadge" style="display: none;">
          <span id="countdownTimer">00:00:00</span>
        </div>
      </div>

      <!-- 작은 퍼센트 뱃지 -->
      <div class="percent-chip" id="percentChip">--%</div>
    </div>
  </div>

  <script src="stateImages.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
